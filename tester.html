<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOUNCE™ - Secure Catalog Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container" style="max-width: 600px; margin-top: 50px;">
        <section class="card standard-card">
            <h2>Secure Catalog Portal</h2>
            <p>Select a track from your catalog. Purchasing initiates an automated device handshake to lock the file exclusively to your hardware.</p>
            
            <form id="catalogOrderForm">
                <!-- Catalog Selection -->
                <div style="margin-bottom: 15px;">
                    <label for="selected_song" style="display: block; font-weight: bold; margin-bottom: 5px;">Choose Grateful Dead Track:</label>
                    <select id="selected_song" name="selected_song" style="width: 100%; padding: 8px; font-size: 16px;">
                        <option value="catalog/song_01.mp3">Track 1: Live Live Audio</option>
                        <option value="catalog/song_02.mp3">Track 2: Live Live Audio</option>
                        <option value="catalog/song_03.mp3">Track 3: Live Live Audio</option>
                        <option value="catalog/song_04.mp3">Track 4: Live Live Audio</option>
                        <option value="catalog/song_05.mp3">Track 5: Live Live Audio</option>
                        <option value="catalog/song_06.mp3">Track 6: Live Live Audio</option>
                        <option value="catalog/song_07.mp3">Track 7: Live Live Audio</option>
                        <option value="catalog/song_08.mp3">Track 8: Live Live Audio</option>
                        <option value="catalog/song_09.mp3">Track 9: Live Live Audio</option>
                        <option value="catalog/song_10.mp3">Track 10: Live Live Audio</option>
                    </select>
                </div>

                <!-- Hardware Seed Handshake Status -->
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 5px;">Device Fingerprint Status:</label>
                    <input type="text" id="hardware_seed_display" readonly style="width: 100%; padding: 8px; font-size: 14px; background: #eee; color: #555;">
                </div>

                <button type="submit" class="action-button" style="width: 100%; padding: 12px; cursor: pointer; background: #27ae60; color: white; font-weight: bold;">Pay & Download Secure File</button>
            </form>

            <div id="responseMessage" style="margin-top: 20px; font-weight: bold;"></div>
        </section>
    </main>

    <script>
        // Client-side hardware handshake generation
        function generateHardwareSeed() {
            const navigatorInfo = navigator.userAgent + navigator.language + screen.width + screen.height;
            let hash = 0;
            for (let i = 0; i < navigatorInfo.length; i++) {
                const char = navigatorInfo.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash |= 0;
            }
            return Math.abs(hash);
        }

        const userSeed = generateHardwareSeed();
        document.getElementById('hardware_seed_display').value = "Secured & Handshaked (Seed: " + userSeed + ")";

        // Handle form submission, tunnel transmission, and return delivery
        document.getElementById('catalogOrderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const chosenSong = document.getElementById('selected_song').value;
            const messageDiv = document.getElementById('responseMessage');
            
            messageDiv.style.color = "#333";
            messageDiv.innerText = "Processing payment and handshaking with local server...";

            try {
                // Replace with your active Ngrok forwarding URL ending in /process-and-dispatch
                const ngrokUrl = "https://YOUR-NGROK-ID.ngrok-free.app/process-and-dispatch";

                const response = await fetch(ngrokUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        file_path: chosenSong,
                        vendor_seed: userSeed
                    })
                });

                if (response.ok) {
                    messageDiv.style.color = "green";
                    messageDiv.innerText = "Success! File compiled for your hardware. Preparing download...";
                    
                    // Automatically trigger file download from server response blob
                    const blob = await response.blob();
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = "Secure_Smart_Media_File.exe";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                } else {
                    messageDiv.style.color = "red";
                    messageDiv.innerText = "Error: Server returned status " + response.status;
                }
            } catch (error) {
                messageDiv.style.color = "red";
                messageDiv.innerText = "Connection failed. Check your Ngrok tunnel!";
            }
        });
    </script>
</body>
</html>
