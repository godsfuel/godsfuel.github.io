<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RIX Records - Secure Audio Storefront</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; max-width: 700px; margin: 40px auto; padding: 30px; border-radius: 8px; border: 1px solid #333; }
        h2 { color: #ffb703; }
        .product-box { background: #1e1e1e; padding: 20px; border-radius: 6px; margin-top: 20px; border: 1px solid #444; }
        .track-list { max-height: 200px; overflow-y: auto; background: #121212; padding: 10px; border: 1px solid #333; border-radius: 4px; margin-top: 10px; }
        .track-item { padding: 6px 0; border-bottom: 1px solid #222; }
        button { background: #fb8500; color: #000; font-weight: bold; border: none; padding: 12px 20px; cursor: pointer; border-radius: 4px; margin-top: 15px; width: 100%; }
        button:hover { background: #ffb703; }
        pre { background: #000; color: #00ffcc; padding: 10px; border-radius: 4px; font-size: 12px; text-align: left; overflow-x: auto; }
        a.download-btn { display: block; background: #00ffcc; color: #000; text-align: center; font-weight: bold; padding: 12px; margin-top: 10px; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>RIX Records Secure Catalog</h2>
    <p>Simulating independent artist master distribution secured by Spooky Sovereign.</p>

    <div class="product-box">
        <h3>Master Catalog Inventory</h3>
        <label>Customer Email:</label>
        <input type="email" id="customerEmail" value="artist@rixrecords.com" style="width:100%; padding:10px; margin-top:5px; background:#2a2a2a; color:#fff; border:1px solid #555; box-sizing: border-box;">
        
        <p style="margin-top: 15px; margin-bottom: 5px; font-weight: bold;">Select Master Tracks:</p>
        <div class="track-list" id="trackContainer">
            Connecting to master vault...
        </div>
        
        <button onclick="initiateOrder()">Purchase & Package via Spooky</button>
    </div>

    <div class="product-box" style="margin-top: 20px;">
        <h3>Transaction & Fulfillment Output</h3>
        <pre id="outputLog">Awaiting customer selection...</pre>
        <div id="downloadContainer"></div>
    </div>

    <script>
        // Load available tracks from the local Spooky/Vault engine on page load
        window.onload = async function() {
            try {
                const res = await fetch('http://127.0.0.1:5000/api/tracks');
                const data = await res.json();
                const container = document.getElementById('trackContainer');
                container.innerHTML = '';
                
                if (!data.tracks || data.tracks.length === 0) {
                    container.innerHTML = '<div style="padding:10px; color:#888;">No tracks found in vault. Add files to cave_vault/masters/</div>';
                    return;
                }

                data.tracks.forEach((track, index) => {
                    const div = document.createElement('div');
                    div.className = 'track-item';
                    div.innerHTML = `<label><input type="checkbox" name="tracks" value="${track}" ${index === 0 ? 'checked' : ''}> ${track}</label>`;
                    container.appendChild(div);
                });
            } catch (err) {
                document.getElementById('trackContainer').innerHTML = '<div style="color:red;">Error connecting to local master vault API. Ensure backend is running.</div>';
            }
        }

        async function initiateOrder() {
            const email = document.getElementById('customerEmail').value;
            const logBox = document.getElementById('outputLog');
            const downloadContainer = document.getElementById('downloadContainer');
            downloadContainer.innerHTML = '';

            const selectedTracks = Array.from(document.querySelectorAll('input[name="tracks"]:checked'))
                                          .map(el => el.value);

            if (selectedTracks.length === 0) {
                alert("Please select at least one track.");
                return;
            }

            logBox.textContent = "Verifying customer hardware anchor (cache.dat)...";

            try {
                const fulfillRes = await fetch('http://127.0.0.1:5000/api/fulfill-order', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: email, tracks: selectedTracks })
                });
                
                const result = await fulfillRes.json();
                logBox.textContent = JSON.stringify(result, null, 2);

                if (fulfillRes.status === 200 && result.download_link) {
                    downloadContainer.innerHTML = `<a class="download-btn" href="${result.download_link}">Download Armored .SPookY Container (.zip)</a>`;
                } else if (result.redirect) {
                    setTimeout(() => {
                        window.location.href = result.redirect;
                    }, 2000);
                }
            } catch (err) {
                logBox.textContent = "Fulfillment network error: " + err.message;
            }
        }
    </script>
</body>
</html>
